<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Calculator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .calculator {
            width: 360px;
            padding: 25px;
            background: white;
            border-radius: 25px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.25);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        .history {
            padding: 20px;
            background: #f5f5f5;
            border-radius: 15px;
        }

        .history h2 {
            margin-top: 0;
        }

        #historyList {
            color: #666;
        }
    </style>
</head>

<body>

    <div class="calculator">

        <h1>Smart Calculator</h1>

        <div class="history">
            <h2>Calculation History</h2>

            <div id="historyList">
                <p>No calculations yet.</p>
            </div>
        </div>

    </div>

</body>
</html>
