
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Calculator</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;

            font-family: "Segoe UI", Arial, sans-serif;

            background:
                radial-gradient(circle at top left, #8b5cf6, transparent 40%),
                radial-gradient(circle at bottom right, #2563eb, transparent 40%),
                #111827;

            transition: 0.4s;
        }

        /* MAIN CALCULATOR */

        .calculator {
            width: 390px;
            max-width: 100%;

            padding: 25px;

            border-radius: 28px;

            background: rgba(255, 255, 255, 0.12);

            border: 1px solid rgba(255, 255, 255, 0.2);

            backdrop-filter: blur(20px);

            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.35);

            color: white;
        }

        /* HEADER */

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 24px;
        }

        .theme-btn {
            width: 42px;
            height: 42px;

            border: none;
            border-radius: 50%;

            background: rgba(255,255,255,0.15);

            color: white;

            font-size: 20px;

            cursor: pointer;

            transition: 0.2s;
        }

        .theme-btn:hover {
            transform: rotate(20deg) scale(1.08);
        }

        /* DISPLAY */

        .display-container {
            margin-bottom: 18px;
        }

        #display {
            width: 100%;
            height: 90px;

            padding: 15px;

            border: none;
            outline: none;

            border-radius: 18px;

            background: rgba(0,0,0,0.25);

            color: white;

            font-size: 36px;

            text-align: right;

            font-weight: 600;
        }

        #display::placeholder {
            color: rgba(255,255,255,0.5);
        }

        /* BUTTONS */

        .buttons {
            display: grid;

            grid-template-columns: repeat(4, 1fr);

            gap: 12px;
        }

        button {
            height: 62px;

            border: none;

            border-radius: 17px;

            font-size: 20px;

            font-weight: 600;

            cursor: pointer;

            color: white;

            background: rgba(255,255,255,0.12);

            transition:
                transform 0.12s,
                background 0.2s;
        }

        button:hover {
            background: rgba(255,255,255,0.22);
        }

        button:active {
            transform: scale(0.92);
        }

        /* SPECIAL BUTTONS */

        .operator {
            background: linear-gradient(135deg, #8b5cf6, #6366f1);
        }

        .operator:hover {
            background: linear-gradient(135deg, #9f67ff, #7175ff);
        }

        .equals {
            background: linear-gradient(135deg, #ec4899, #8b5cf6);

            grid-row: span 2;

            height: 136px;
        }

        .clear {
            background: linear-gradient(135deg, #ef4444, #dc2626);
        }

        .delete {
            background: rgba(255,255,255,0.18);
        }

        /* HISTORY */

        .history {
            margin-top: 25px;

            padding: 18px;

            border-radius: 18px;

            background: rgba(0,0,0,0.18);
        }

        .history-header {
            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 12px;
        }

        .history-header h2 {
            font-size: 18px;
        }

        .clear-history {
            width: auto;

            height: auto;

            padding: 7px 12px;

            font-size: 12px;

            border-radius: 10px;

            background: rgba(255,255,255,0.15);
        }

        #historyList {
            max-height: 150px;

            overflow-y: auto;
        }

        .history-item {
            padding: 10px;

            margin-bottom: 8px;

            border-radius: 10px;

            background: rgba(255,255,255,0.08);

            font-size: 14px;

            color: rgba(255,255,255,0.9);
        }

        .empty-history {
            text-align: center;

            color: rgba(255,255,255,0.5);

            font-size: 14px;

            padding: 10px;
        }

        /* FOOTER */

        .footer {
            text-align: center;

            margin-top: 18px;

            font-size: 12px;

            color: rgba(255,255,255,0.55);
        }

        /* LIGHT MODE */

        body.light {
            background:
                radial-gradient(circle at top left, #c4b5fd, transparent 40%),
                radial-gradient(circle at bottom right, #93c5fd, transparent 40%),
                #eef2ff;
        }

        body.light .calculator {
            background: rgba(255,255,255,0.55);

            border: 1px solid rgba(255,255,255,0.7);

            color: #1f2937;
        }

        body.light button {
            color: #1f2937;

            background: rgba(255,255,255,0.55);
        }

        body.light .theme-btn {
            color: #1f2937;
        }

        body.light #display {
            background: rgba(255,255,255,0.6);

            color: #1f2937;
        }

        body.light .history {
            background: rgba(255,255,255,0.35);
        }

        /* MOBILE */

        @media (max-width: 450px) {

            .calculator {
                padding: 18px;

                border-radius: 22px;
            }

            #display {
                height: 75px;

                font-size: 28px;
            }

            button {
                height: 56px;

                font-size: 18px;
            }

            .equals {
                height: 124px;
            }
        }
    </style>
</head>

<body>

<div class="calculator">

    <!-- HEADER -->

    <div class="header">

        <h1>🧮 Smart Calculator</h1>

        <button
            class="theme-btn"
            onclick="toggleTheme()"
            title="Change theme">

            🌙

        </button>

    </div>


    <!-- DISPLAY -->

    <div class="display-container">

        <input
            type="text"
            id="display"
            placeholder="0"
            readonly>

    </div>


    <!-- CALCULATOR BUTTONS -->

    <div class="buttons">

        <button
            class="clear"
            onclick="clearDisplay()">

            AC

        </button>

        <button
            class="delete"
            onclick="deleteLast()">

            ⌫

        </button>

        <button
            class="operator"
            onclick="appendValue('%')">

            %

        </button>

        <button
            class="operator"
            onclick="appendValue('/')">

            ÷

        </button>


        <button onclick="appendValue('7')">7</button>

        <button onclick="appendValue('8')">8</button>

        <button onclick="appendValue('9')">9</button>

        <button
            class="operator"
            onclick="appendValue('*')">

            ×

        </button>


        <button onclick="appendValue('4')">4</button>

        <button onclick="appendValue('5')">5</button>

        <button onclick="appendValue('6')">6</button>

        <button
            class="operator"
            onclick="appendValue('-')">

            −

        </button>


        <button onclick="appendValue('1')">1</button>

        <button onclick="appendValue('2')">2</button>

        <button onclick="appendValue('3')">3</button>

        <button
            class="operator"
            onclick="appendValue('+')">

            +

        </button>


        <button onclick="appendValue('0')">0</button>

        <button onclick="appendValue('.')">.</button>

        <button
            class="equals"
            onclick="calculate()">

            =

        </button>

    </div>


    <!-- HISTORY -->

    <div class="history">

        <div class="history-header">

            <h2>📜 History</h2>

            <button
                class="clear-history"
                onclick="clearHistory()">

                Clear

            </button>

        </div>

        <div id="historyList">

            <div class="empty-history">

                No calculations yet.

            </div>

        </div>

    </div>


    <div class="footer">

        Smart Calculator • SY B.Sc. CA

    </div>

</div>


<script>

    const display =
        document.getElementById("display");

    const historyList =
        document.getElementById("historyList");


    /* ADD VALUE */

    function appendValue(value) {

        if (display.value === "Error") {

            display.value = "";

        }

        display.value += value;

    }


    /* CLEAR DISPLAY */

    function clearDisplay() {

        display.value = "";

    }


    /* DELETE LAST CHARACTER */

    function deleteLast() {

        display.value =
            display.value.slice(0, -1);

    }


    /* CALCULATE */

    function calculate() {

        if (display.value.trim() === "") {

            return;

        }

        try {

            const expression =
                display.value;

            const result =
                eval(expression);

            if (!isFinite(result)) {

                throw new Error();

            }

            display.value = result;

            addToHistory(
                expression,
                result
            );

        }

        catch {

            display.value = "Error";

        }

    }


    /* ADD TO HISTORY */

    function addToHistory(
        expression,
        result
    ) {

        const empty =
            document.querySelector(
                ".empty-history"
            );

        if (empty) {

            empty.remove();

        }

        const item =
            document.createElement("div");

        item.className =
            "history-item";

        item.textContent =
            expression + " = " + result;

        historyList.prepend(item);

    }


    /* CLEAR HISTORY */

    function clearHistory() {

        historyList.innerHTML = `

            <div class="empty-history">

                No calculations yet.

            </div>

        `;

    }


    /* DARK / LIGHT MODE */

    function toggleTheme() {

        document.body.classList.toggle("light");

        const button =
            document.querySelector(
                ".theme-btn"
            );

        if (
            document.body.classList.contains(
                "light"
            )
        ) {

            button.textContent = "☀️";

        } else {

            button.textContent = "🌙";

        }

    }


    /* KEYBOARD SUPPORT */

    document.addEventListener(
        "keydown",
        function(event) {

            const key = event.key;

            if (
                /[0-9+\-*/.%]/.test(key)
            ) {

                appendValue(key);

            }

            else if (
                key === "Enter" ||
                key === "="
            ) {

                calculate();

            }

            else if (
                key === "Backspace"
            ) {

                deleteLast();

            }

            else if (
                key === "Escape"
            ) {

                clearDisplay();

            }

        }
    );

</script>

</body>
</html>
